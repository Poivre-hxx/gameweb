game_id: jj_tobidase_daisakusen_1987
tags: [Shooter, Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character in horizontally scrolling platform stages, shooting enemies and jumping to navigate.
  Projectiles can be fired to defeat enemies at range.
  Items are scattered throughout stages and must be collected.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, shoot projectiles, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Shoot projectile at enemy → defeat threat
    - Collect item → gain power-ups or points
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms and fly in patterns, contact damage, defeated by projectile attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, items scattered throughout, platforms at multiple heights]
  win_condition: Reach the end of each stage