game_id: lost_word_of_jenny_1987
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character in horizontally scrolling platform stages, using magic attacks to defeat enemies.
  Magic projectiles can be cast to attack enemies at range.
  Items are scattered throughout stages and must be collected.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, cast magic projectiles, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Cast magic at enemy → defeat threat
    - Collect item → gain power-ups or points
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by magic attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, items scattered throughout, platforms at multiple heights]
  win_condition: Reach the end of each stage