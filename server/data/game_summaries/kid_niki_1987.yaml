game_id: kid_niki_1987
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a ninja in horizontally scrolling platform stages, using a spinning sword to defeat enemies.
  The sword spins in a circular motion providing attack coverage around the character.
  Items are scattered throughout stages and must be collected.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, spin sword to attack]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Spin sword → circular attack motion, defeat enemies
    - Collect item → gain power-ups or points
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by spinning sword attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, items scattered throughout, platforms at multiple heights]
  win_condition: Reach the end of each stage