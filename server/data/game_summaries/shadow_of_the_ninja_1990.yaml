game_id: shadow_of_the_ninja_1990
tags: [Shooter, Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a ninja in horizontally scrolling platform stages, using sword attacks and throwing weapons.
  The ninja can attack with a sword at close range and throw projectiles at distant enemies.
  The character can climb and cling to surfaces for advanced platforming.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, sword attack, throw projectiles, climb surfaces, cling to surfaces]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Sword attack enemy → defeat threat at close range
    - Throw projectile at enemy → ranged attack
    - Climb surface → ascend or descend
    - Cling to surface → advanced navigation
    - Touch enemy or projectile → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms and fly in patterns, contact damage, defeated by sword or projectile attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, climbing and clinging enable advanced navigation, dual weapon system for tactical combat]
  win_condition: Reach the end of each stage