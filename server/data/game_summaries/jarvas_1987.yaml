game_id: jarvas_1987
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a transforming craft in horizontally scrolling stages, shooting enemies and avoiding obstacles.
  The craft can transform between different forms with varied capabilities.
  Enemies attack in formations and patterns requiring evasion and shooting skills.
  The objective is to survive through continuous waves and reach the end of each area.

key_mechanics:
  player_abilities: [fly in multiple directions, shoot continuously, transform between forms]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Transform to different form → change capabilities
    - Touch enemy or projectile → take damage
    - Progress through stage → advance forward
  enemy_characteristics: [aerial and ground enemies attack, shoot projectiles, contact damage, varied formations]
  environment_characteristics: [horizontally auto-scrolling stages, transformation provides tactical options, enemies spawn continuously]
  win_condition: Survive through the area and reach the end