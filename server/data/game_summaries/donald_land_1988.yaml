game_id: donald_land_1988
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character in horizontally scrolling platform stages, jumping and attacking enemies.
  The character can attack enemies and collect items scattered throughout stages.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, attack enemies, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Attack enemy → defeat threat
    - Collect item → gain power-ups or points
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, items scattered throughout, platforms at multiple heights]
  win_condition: Reach the end of each stage