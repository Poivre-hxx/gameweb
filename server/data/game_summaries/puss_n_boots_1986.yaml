game_id: puss_n_boots_1986
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character in horizontally scrolling platform stages, using weapons to defeat enemies.
  Various weapons can be used to attack enemies at close or medium range.
  Items are scattered throughout stages and must be collected.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, attack with weapon, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Attack enemy with weapon → defeat threat
    - Collect item → gather power-ups or points
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by weapon attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, items scattered throughout, platforms at multiple heights]
  win_condition: Reach the end of each stage