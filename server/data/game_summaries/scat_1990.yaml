game_id: scat_1990
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a soldier with a jetpack in horizontally scrolling stages, shooting enemies in multiple directions.
  The soldier can fly freely and shoot both forward and backward simultaneously.
  Weapon pods orbit the player and provide additional firepower.
  Power-ups can be collected to enhance weapons and capabilities.
  The objective is to survive through continuous waves and reach the end of each area.

key_mechanics:
  player_abilities: [fly freely with jetpack in 8 directions, shoot forward and backward simultaneously, collect power-ups]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Shoot forward and backward at same time → attack in both directions
    - Weapon pods orbit player → provide additional firepower
    - Collect power-up → enhance weapons or gain abilities
    - Touch enemy or projectile → take damage
    - Progress through stage → advance forward
  enemy_characteristics: [ground and aerial enemies attack from both sides, shoot projectiles, contact damage, varied formations]
  environment_characteristics: [horizontally auto-scrolling terrain, free flight with jetpack, bidirectional shooting for tactical advantage, orbiting weapon pods multiply firepower]
  win_condition: Survive through the area and reach the end