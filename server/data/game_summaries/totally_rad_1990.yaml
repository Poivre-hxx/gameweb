game_id: totally_rad_1990
tags: [Shooter, Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character with magic abilities in horizontally scrolling platform stages.
  Various magic spells can be used to attack enemies and navigate obstacles.
  Magic abilities can be upgraded by collecting items.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, shoot magic projectiles, use magic abilities, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Shoot magic projectile at enemy → defeat threat
    - Use magic ability → special attacks or effects
    - Collect item → upgrade magic or restore health
    - Touch enemy or projectile → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms and fly in patterns, contact damage, defeated by magic attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, magic abilities provide tactical options, items upgrade capabilities]
  win_condition: Reach the end of each stage