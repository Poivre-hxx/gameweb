game_id: booby_kids_1987
tags: [Platform, Arcade]
view: frame view

gameplay_summary: |
  The player controls a character in fixed-screen stages, collecting all bombs to trigger the exit.
  Bombs must be collected in each stage before the exit becomes accessible.
  Enemies patrol the stage and must be avoided through careful timing.
  The objective is to collect all bombs and reach the exit in each stage.

key_mechanics:
  player_abilities: [move left/right, jump between platforms]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Collect bomb → progress toward stage completion
    - Collect all bombs → exit opens
    - Touch enemy → lose life
    - Reach exit after collecting bombs → complete stage
  enemy_characteristics: [patrol platforms in patterns, contact damage only, cannot be defeated, must be avoided]
  environment_characteristics: [fixed-screen platform layouts, bombs scattered throughout, exit locked until all bombs collected, enemies create timing challenges]
  win_condition: Collect all bombs and reach the exit