game_id: astyanax_1989
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a warrior in horizontally scrolling platform stages, using an axe and magic attacks to defeat enemies.
  The axe provides melee range and magic spells offer powerful attacks consuming energy.
  Power-ups can be collected to enhance weapons and restore energy.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, axe attack, magic attack (consumes energy), collect power-ups]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Axe attack enemy → defeat threat at close range
    - Magic attack → powerful area damage, consumes energy
    - Collect power-up → enhance weapons or restore energy
    - Touch enemy or projectile → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms and fly in patterns, contact damage, defeated by axe or magic attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, magic provides tactical power at cost of energy, power-ups enhance capabilities]
  win_condition: Reach the end of each stage