game_id: conquest_of_the_crystal_palace_1990
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a warrior with a dog companion in horizontally scrolling platform stages.
  The warrior attacks with a sword while the dog provides additional attacks.
  Items can be collected to upgrade abilities and enhance the dog companion.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, sword attack, command dog companion, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Sword attack enemy → defeat threat
    - Dog companion attacks → additional firepower
    - Collect item → upgrade abilities or enhance dog
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by sword or dog attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, dog companion provides tactical support, items upgrade capabilities]
  win_condition: Reach the end of each stage