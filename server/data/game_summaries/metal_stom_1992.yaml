game_id: metal_storm_1992
tags: [Shooter, Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a mech in horizontally scrolling platform stages with gravity reversal mechanics.
  Gravity can be reversed to walk on ceilings and navigate inverted terrain.
  The mech shoots continuously to defeat enemies while switching between floor and ceiling.
  The objective is to advance through stages, defeat enemies, and reach mission objectives.

key_mechanics:
  player_abilities: [move left/right, jump, shoot continuously, reverse gravity]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Shoot enemy → destroy threat
    - Reverse gravity → flip to ceiling or floor
    - Walk on ceiling → access inverted areas
    - Touch enemy or projectile → take damage
    - Complete objective → advance stage
  enemy_characteristics: [patrol platforms and ceilings, shoot projectiles, contact damage, attack from multiple orientations, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, gravity reversal enables vertical navigation, ceiling and floor both navigable]
  win_condition: Complete missions and reach objectives