game_id: milons_secret_castle_1986
tags: [Platform, Arcade]
view: frame view

gameplay_summary: |
  The player controls a character exploring a castle with interconnected rooms, shooting bubbles at enemies.
  Hidden rooms and secret passages are discovered by shooting walls and specific locations.
  Keys and items must be found to unlock doors and access new areas.
  The castle's non-linear structure requires exploration and backtracking.
  The objective is to explore the castle, find hidden items, and reach the final area.

key_mechanics:
  player_abilities: [move left/right, jump, shoot bubbles at enemies, climb stairs between floors]
  interaction_modes:
    - Shoot bubble at enemy → defeat threat
    - Shoot wall repeatedly → reveal hidden room or item
    - Collect key → unlock door to new area
    - Collect item → gain new abilities or progress
    - Touch enemy → take damage
    - Find hidden rooms → discover secrets and items
    - Navigate between connected rooms → explore castle
  enemy_characteristics: [patrol rooms, contact damage, defeated by bubble projectiles, respawn when re-entering rooms]
  environment_characteristics: [multi-room castle with interconnected areas, hidden rooms behind walls, locked doors requiring keys, non-linear progression requiring exploration]
  win_condition: Explore the castle and reach the final area