game_id: super_c_1990
tags: [Shooter, Run and Gun, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a soldier in stages alternating between side-scrolling and top-down perspectives, shooting enemies with various weapons.
  Weapon power-ups provide different firing patterns including spread shots, lasers, and rapid fire.
  The soldier can run, jump, and shoot in eight directions while progressing through enemy territory.
  Some stages shift to top-down perspective with similar shooting mechanics.
  The objective is to fight through all stages and destroy the enemy base.

key_mechanics:
  player_abilities: [move left/right, jump, shoot in 8 directions, lie prone in side-scrolling, collect weapon power-ups]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Jump between platforms → navigate terrain
    - Lie prone → avoid high projectiles
    - Collect weapon power-up → change firing pattern
    - Spread shot fires multiple bullets → wide coverage
    - Laser penetrates enemies → pierce through
    - Rapid fire increases shot speed → higher damage output
    - Touch enemy or projectile → instant death
    - Complete stage → advance forward
  enemy_characteristics: [ground and aerial enemies attack in side-scrolling, enemies in top-down areas, shoot projectiles, contact means instant death, varied enemy types]
  environment_characteristics: [stages alternate between side-scrolling and top-down perspectives, weapon power-ups change firing patterns, one-hit death creates high difficulty]
  win_condition: Complete all stages and destroy the final base