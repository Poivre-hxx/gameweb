game_id: doraemon_1986
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character in horizontally scrolling platform stages, using gadgets to defeat enemies.
  Various gadgets can be used as weapons or tools to overcome obstacles.
  Items are scattered throughout stages and must be collected.
  The objective is to navigate platforms, use gadgets effectively, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, use gadgets to attack or interact]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Use gadget on enemy → defeat threat
    - Collect item → gather power-ups or points
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by gadget attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, items scattered throughout, platforms at multiple heights]
  win_condition: Reach the end of each stage