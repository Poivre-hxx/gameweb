game_id: batman_1989
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a hero in horizontally scrolling platform stages, using melee attacks and acrobatic jumps.
  The hero can jump off walls for enhanced mobility.
  Items can be collected to restore health and gain power-ups.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, jump off walls, punch attack, jump kick, collect items]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Jump off wall → enhanced mobility, reach higher areas
    - Punch attack enemy → defeat threat
    - Jump kick → aerial attack
    - Collect item → restore health or gain power-ups
    - Touch enemy → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms, contact damage, defeated by melee attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, wall jumping enables advanced navigation, items scattered throughout]
  win_condition: Reach the end of each stage