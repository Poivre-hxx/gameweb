game_id: image_fight_1990
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a spacecraft in vertically scrolling stages, shooting enemies and configuring weapon pods.
  Pods can be attached in different formations providing varied firing patterns.
  Power-ups can be collected to enhance weapons and capabilities.
  The objective is to survive through continuous waves and reach the end of each area.

key_mechanics:
  player_abilities: [fly in 8 directions, shoot continuously, configure pod formations, collect power-ups]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Configure pods → change firing formation
    - Different formations provide different coverage → tactical choices
    - Collect power-up → enhance weapons or gain abilities
    - Touch enemy or projectile → take damage
    - Progress through stage → advance forward
  enemy_characteristics: [aerial and ground enemies attack, shoot projectiles, contact damage, varied formations]
  environment_characteristics: [vertically auto-scrolling terrain, pod formations provide tactical options, training stages prepare for main missions]
  win_condition: Survive through the area and reach the end