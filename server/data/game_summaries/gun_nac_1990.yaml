game_id: gun_nac_1990
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a spacecraft in vertically scrolling stages, shooting enemies and collecting currency.
  Currency collected from enemies can be spent at shops to purchase weapon upgrades.
  Multiple weapon types are available for purchase with different capabilities.
  The objective is to survive through continuous waves and reach the end of each area.

key_mechanics:
  player_abilities: [fly in 8 directions, shoot continuously, collect currency, purchase weapons at shops]
  interaction_modes:
    - Shoot enemy → destroy threat, gain currency
    - Collect currency → gain purchasing power
    - Visit shop → purchase weapon upgrades
    - Different weapons provide different tactical options
    - Touch enemy or projectile → take damage
    - Progress through stage → advance forward
  enemy_characteristics: [aerial and ground enemies attack, shoot projectiles, contact damage, drop currency when defeated, varied formations]
  environment_characteristics: [vertically auto-scrolling terrain, shops appear between stages, currency system for purchasing upgrades, multiple weapon types for tactical choices]
  win_condition: Survive through the area and reach the end