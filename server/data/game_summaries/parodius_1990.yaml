game_id: parodius_1990
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a flying character in horizontally scrolling stages, shooting enemies and collecting power capsules.
  Power capsules fill a meter that allows selection of different upgrades including speed, weapons, shields, and options.
  Options are invincible satellites that mirror the player's fire, providing additional firepower.
  The objective is to survive through continuous waves and reach the end of each area.

key_mechanics:
  player_abilities: [fly in multiple directions, shoot continuously, collect power capsules, select upgrades from power meter]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Collect power capsule → advance power meter
    - Select upgrade from meter → activate speed, weapon, shield, or option
    - Options mirror fire → multiply firepower
    - Touch enemy or projectile → take damage, lose power-ups
    - Progress through stage → advance forward
  enemy_characteristics: [aerial and ground enemies attack, shoot projectiles, contact damage, varied formations and patterns]
  environment_characteristics: [horizontally auto-scrolling terrain, power meter system for strategic upgrades, options provide tactical firepower multiplication]
  win_condition: Survive through the area and reach the end