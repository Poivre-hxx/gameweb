game_id: mighty_final_fight_1993
tags: [Beat 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls one of multiple selectable fighters in horizontally scrolling stages, battling waves of enemies.
  Combat uses punches, kicks, and special attacks to defeat groups of attackers.
  Different fighters have unique abilities and fighting styles.
  Enemies attack from both sides and must be defeated to progress forward.
  The objective is to clear all enemies from each area and reach the end of the stage.

key_mechanics:
  player_abilities: [move left/right, punch, kick, grab and throw enemy, use special attacks, select from multiple fighters]
  interaction_modes:
    - Punch enemy → damage opponent
    - Kick enemy → damage opponent
    - Grab enemy → initiate throw
    - Throw enemy → deal significant damage
    - Use special attack → powerful technique
    - Select fighter → choose character with unique style
    - Touch enemy or attack → take damage
    - Defeat all enemies in area → progress forward
  enemy_characteristics: [attack in groups from both sides, varied fighting styles, contact and attack damage, varied enemy types]
  environment_characteristics: [horizontally scrolling stages, multiple selectable fighters with different styles, enemies spawn in waves]
  win_condition: Defeat all enemies and reach the end of each stage