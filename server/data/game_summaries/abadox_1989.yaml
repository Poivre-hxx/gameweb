game_id: abadox_1989
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a character in stages alternating between horizontal and vertical scrolling, shooting enemies.
  The character flies through organic environments shooting in the facing direction.
  Power-ups can be collected to enhance weapons and capabilities.
  The objective is to survive through continuous waves and reach the end of each area.

key_mechanics:
  player_abilities: [fly in 8 directions, shoot continuously, collect power-ups]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Collect power-up → enhance weapons or gain abilities
    - Touch enemy or projectile → take damage
    - Progress through stage → advance forward
  enemy_characteristics: [organic enemies attack, shoot projectiles, contact damage, varied formations]
  environment_characteristics: [stages alternate between horizontal and vertical scrolling, organic biological environments, power-ups dropped by enemies]
  win_condition: Survive through the area and reach the end