game_id: eight_eyes_1988
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a swordsman with a falcon companion in horizontally scrolling platform stages.
  The swordsman attacks with a whip while the falcon provides additional attacks.
  Stages can be tackled in different orders with player-chosen progression.
  The objective is to navigate platforms, defeat enemies, and complete all stages.

key_mechanics:
  player_abilities: [move left/right, jump, attack with whip, command falcon companion]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Attack with whip → defeat enemies at medium range
    - Command falcon to attack → additional firepower
    - Touch enemy → take damage
    - Choose stage order → select progression path
    - Complete stage → advance to next area
  enemy_characteristics: [patrol platforms and fly in patterns, contact damage, defeated by whip or falcon attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, non-linear stage selection, falcon companion provides tactical support]
  win_condition: Complete all stages