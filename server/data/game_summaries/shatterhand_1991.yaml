game_id: shatterhand_1991
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a warrior in horizontally scrolling platform stages, using punch attacks and summoning robot assistants.
  Collecting specific power-ups allows summoning robots that provide additional firepower.
  Different robot combinations offer different combat advantages.
  The objective is to navigate platforms, defeat enemies, and reach the end of each stage.

key_mechanics:
  player_abilities: [move left/right, jump, punch attack, collect power-ups, summon robot assistants]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Punch attack enemy → defeat threat
    - Collect power-ups → enable robot summoning
    - Summon robot → gain additional firepower
    - Different robot combinations provide different advantages → tactical choices
    - Touch enemy or projectile → take damage
    - Reach end of stage → complete level
  enemy_characteristics: [patrol platforms and fly in patterns, contact damage, defeated by punch or robot attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, robot assistants provide tactical support, power-up combinations determine robot types]
  win_condition: Reach the end of each stage