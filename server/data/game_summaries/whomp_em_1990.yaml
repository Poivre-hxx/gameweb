game_id: whomp_em_1990
tags: [Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a warrior in horizontally scrolling platform stages, using a spear and acquired weapons.
  Defeating stage bosses grants new weapons with unique properties.
  Different weapons can be switched between for tactical advantage.
  Stages can be selected in non-linear order.
  The objective is to navigate platforms, defeat enemies, and complete all stages.

key_mechanics:
  player_abilities: [move left/right, jump, spear attack, acquire and switch between weapons]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Spear attack enemy → defeat threat
    - Defeat stage boss → acquire new weapon
    - Switch weapon → use different attack type
    - Different weapons provide different tactical options
    - Select stage order → choose progression path
    - Touch enemy or projectile → take damage
    - Complete stage → advance forward
  enemy_characteristics: [patrol platforms, contact damage, defeated by attacks, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, non-linear stage selection, acquired weapons provide tactical variety]
  win_condition: Complete all stages