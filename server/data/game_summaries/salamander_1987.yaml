game_id: salamander_1987
tags: [Shooter, Shoot 'em up, Arcade]
view: scroller view

gameplay_summary: |
  The player controls a spacecraft through stages that alternate between vertical and horizontal scrolling.
  Power capsules can be collected to activate different weapon upgrades and abilities.
  Multiple weapon types include missiles, lasers, and options that provide additional firepower.
  The objective is to survive through continuous waves in both scrolling directions and reach the end of each area.

key_mechanics:
  player_abilities: [move in 8 directions, shoot continuously, collect power capsules for upgrades]
  interaction_modes:
    - Shoot enemy → destroy threat
    - Collect power capsule → activate weapon upgrade or ability
    - Multiple capsules → strengthen weapons or add options
    - Touch enemy or projectile → take damage
    - Progress through stage → advance forward in alternating directions
  enemy_characteristics: [aerial and organic enemies attack, shoot projectiles, contact damage, varied formations in both vertical and horizontal stages]
  environment_characteristics: [stages alternate between vertical and horizontal scrolling, power capsule system for upgrades, biological/organic themed environments]
  win_condition: Survive through all stages in both scrolling directions