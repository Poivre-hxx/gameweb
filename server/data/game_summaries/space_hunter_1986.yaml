game_id: space_hunter_1986
tags: [Shooter, Platform, Arcade]
view: scroller view

gameplay_summary: |
  The player controls an armored suit in horizontally scrolling stages, shooting enemies and navigating platforms.
  The suit can jump between platforms and shoot in multiple directions.
  Enemies attack from various angles and must be defeated or avoided.
  The objective is to explore stages, defeat enemies, and reach designated goals.

key_mechanics:
  player_abilities: [move left/right, jump, shoot in facing direction]
  interaction_modes:
    - Jump between platforms → navigate terrain
    - Shoot enemy → destroy threat
    - Touch enemy or projectile → take damage
    - Reach goal → complete stage
  enemy_characteristics: [patrol platforms and fly in patterns, shoot projectiles, contact damage, varied enemy types]
  environment_characteristics: [horizontally scrolling platform stages, multiple vertical levels, enemies spawn throughout]
  win_condition: Navigate through stages and reach the goal