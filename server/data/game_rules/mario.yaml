## Game Systems (Six-Layer Architecture)

### Layer 1: GameSceneSystem
**Responsibility**: Manage entity lifecycle, level progression, and game pacing

**OnCreate Phase**:
1. Load map data (map.json)
2. Instantiate all entities with SpawnType = init based on map's "mapping" and "grid_str"
3. Set correct Position, Size, Sprite, Collider, PhysicsBody components for each entity
4. Enemy AI Type Initialization
   - Query all entities tagged as enemy
   - For each enemy, detect the element type directly below it (use get_tile_at to get map element at enemy position + height)
   - Add corresponding AI components and PhysicsBody based on element below:
     - **Ground Patrol Type** (below is ground or breakable brick):
       - Add EnemyAI component, type = "ground_patrol"
       - Add PhysicsBody('dynamic') component for gravity
     - **Flying Patrol Type** (below is space in air):
       - Add EnemyAI component, type = "flying_patrol"
       - Add PatrolPath component, record center position, patrol range (100 pixels left/right, 80 pixels up/down), current state = "left"
       - Add PhysicsBody('kinematic') component (no gravity)
     - **Stationary Turret Type** (below is pipe):
       - Add EnemyAI component, type = "stationary"
       - Add PhysicsBody('kinematic') component (static-like behavior)
5. Add QuestionBlock component for question blocks (mark activation state)
6. Add Cannon component for cannons (shooting timer)
7. Add MovingPlatform component for moving platforms (movement range and direction)

**OnUpdate Phase**:
1. **Entity Destruction Handling**:
   - Check all entities marked as `mark_for_destruction`
   - Remove these entities from the world
2. **Game End Condition Detection**:
   - If player is destroyed → Game failure
   - If player reaches right edge of map (player.x >= map width - 50) → Game victory
3. **Cannon Firing Logic** (using deferred creation pattern):
   - Query all entities with Cannon and Position components
   - Use deferred creation pattern to avoid modifying collection during iteration
   - Step 1 (Collection phase) - Iterate through all cannon entities:
     - For each cannon, decrement cooldown: cannon.cooldown -= delta_time
     - If cooldown complete (cooldown <= 0):
       - Collect bullet creation parameters to list: (cannon position x, cannon position y, firing direction (-1, 0))
       - Reset cooldown: cannon.cooldown = cannon.fire_interval (10.0 seconds)
   - Step 2 (Creation phase) - Batch create bullets after iteration completes:
     - Iterate through all collected bullet parameters
     - Call factory.create_bullet() for each to create bullet entities

---

### Layer 2: UserInputSystem
**Responsibility**: Map player's control inputs to in-game intents (ActionIntent)

**OnUpdate Phase**:
1. Query all entities with `Tag.value == "player"` and `ActionIntent` components
2. **Handle Horizontal Movement Input**:
   - Detect A/D or Left/Right arrow keys
   - A or Left: Set ActionIntent.move_direction = (-1, 0)  # Left
   - D or Right: Set ActionIntent.move_direction = (1, 0)  # Right
   - No key: Set ActionIntent.move_direction = (0, 0)  # Stop
3. **Handle Jump Input**:
   - Detect Spacebar
   - If jump key pressed and player is on ground (is_grounded == True):
     - Set ActionIntent.action = "jump"

---

### Layer 3: DecisionSystem
**Responsibility**: Drive AI behavior logic, control enemies and moving platforms

**OnUpdate Phase**:

**1. Enemy Patrol Logic**:
- Query all entities with EnemyAI, Position, Velocity, Tag components
- For each enemy entity, execute different logic based on AI type:
  - **Ground Patrol Type** (enemy_ai.type == "ground_patrol"):
    - Maintain constant horizontal movement speed
    - Direction reversal handled by collision system when hitting obstacles
  - **Flying Patrol Type** (enemy_ai.type == "flying_patrol"):
    - Get PatrolPath component
    - Implement four-direction loop patrol state machine: left → down → right → up → left
    - State "left": Set vx = -0.6, vy = 0, switch to "down" when reaching left boundary
    - State "down": Set vx = 0, vy = 0.6, switch to "right" when reaching bottom boundary
    - State "right": Set vx = 0.6, vy = 0, switch to "up" when reaching right boundary
    - State "up": Set vx = 0, vy = -0.6, switch to "left" when reaching top boundary
    - Boundary detection: Compare current position with patrol center point and patrol range
  - **Stationary Turret Type** (enemy_ai.type == "stationary"):
    - Set vx = 0, vy = 0, completely stationary

**2. Moving Platform Control**:
- Query all entities with MovingPlatform, Position, Velocity components
- For each moving platform:
  - Check if reached movement range boundary
  - If position <= start position - movement range, set direction = 1 (downward)
  - If position >= start position + movement range, set direction = -1 (upward)
  - Update velocity based on direction: vel.vy = platform.direction * platform.speed (8 pixels/second)

---

### Layer 4: ActionSystem
**Responsibility**: Read ActionIntent and execute specific behaviors (set velocity, jumping, etc.)

**OnUpdate Phase**:

**1. Handle Horizontal Movement Intent**:
- Query all entities with ActionIntent, Velocity, PhysicsConfig components
- For entities with PhysicsConfig.movement_mode == "trigger" (player):
  - If intent.move_direction[0] != 0 (has horizontal movement input):
    - Set vel.vx = intent.move_direction[0] * config.speed (20 pixels/second)
  - Otherwise (no movement input):
    - Set vel.vx = 0

**2. Handle Jump Intent**:
- Query all entities with ActionIntent, Velocity, PhysicsConfig, GroundedFlag components
- For each entity:
  - If intent.action == "jump" and grounded.is_grounded == True:
    - Set vel.vy = -400 (upward jump)
    - Set grounded.is_grounded = False
    - Clear action intent: intent.action = ""

**3. Question Block Activation** (using deferred creation pattern):
- Query all entities with QuestionBlock, Position, Sprite components
- Use deferred creation pattern to avoid modifying collection during iteration
- Step 1 (Collection phase) - Iterate through all question blocks:
  - If qblock.hit_from_below == True and qblock.activated == False (hit and not activated):
    - Collect prop spawn parameters to list: ('mushroom', block position x, block position y - 18)
    - Mark block as activated: qblock.activated = True
    - Change block color: sprite.color = "#808080" (turn gray)
    - Reset collision flag: qblock.hit_from_below = False
- Step 2 (Creation phase) - Batch create props after iteration completes:
  - Iterate through all collected prop parameters
  - Call appropriate factory method based on type (e.g., factory.create_mushroom(x, y, (1, 0)))

---

### Layer 5: SimulationSystem
**Responsibility**: Simulate physical rules in the scene, including gravity, collision detection, physics simulation, and interaction feedback

**OnUpdate Phase**:

**1. Save Previous Frame Position**:
- Query all entities with Position and PreviousPosition components
- For each entity, copy current position to PreviousPosition:
  - prev_pos.x = pos.x
  - prev_pos.y = pos.y

**2. Apply Gravity** (FRAMEWORK AUTO-HANDLES):
- Call `self.apply_physics_body_gravity(delta_time)` - framework automatically applies gravity to all dynamic entities

**3. Update Position**:
- Query all entities with Position and Velocity components
- For each entity, update position based on velocity:
  - pos.x += vel.vx * delta_time
  - pos.y += vel.vy * delta_time

**4. Collision Detection**:
- Query all entities with Position, Size, Collider, Tag components
- For each pair of colliding entities:
  - Use `check_collision()` to detect collision
  - Use `determine_collision_direction()` to get direction
  - Call `self.resolve_physics_collision(eid1, eid2, direction)` - framework automatically handles physics blocking
  - Call `self.handle_collision(eid1, tag1, eid2, tag2, direction)` - handle game-specific logic

**Collision Rules Table** (ONLY game logic, physics blocking handled by framework):

| Entity A | Entity B | Collision Direction | Game Logic (Physics blocking automatic) |
|----------|----------|---------------------|----------------------------------------|
| player | ground | top | Set is_grounded = True |
| player | pipe | top | Set is_grounded = True |
| player | cannon | top | Set is_grounded = True |
| player | breakable brick | bottom | Brick destroyed |
| player | breakable brick | top | Set is_grounded = True |
| player | question block | bottom | Set hit_from_below = True |
| player | question block | top | Set is_grounded = True |
| player | enemy | top | Enemy destroyed, player bounces vy = -200 |
| player | enemy | left/right/bottom | Player destroyed |
| player | coin | any | Prop destroyed, player score +10 |
| player | mushroom | any | Prop destroyed, player score +50 |
| player | bullet | any | Player destroyed |
| player | springboard | top | Player super jump vy = -600 |
| player | moving platform | top | Set is_grounded = True, player follows platform movement |
| enemy (ground patrol) | ground | top | (Framework handles blocking, no game logic needed) |
| enemy (ground patrol) | pipe | top | (Framework handles blocking, no game logic needed) |
| enemy (ground patrol) | breakable brick | top | (Framework handles blocking, no game logic needed) |
| enemy (ground patrol) | question block | top | (Framework handles blocking, no game logic needed) |
| enemy (ground patrol) | ground | left/right | Reverse horizontal direction vx = -vx |
| enemy (ground patrol) | pipe | left/right | Reverse horizontal direction vx = -vx |
| enemy (ground patrol) | breakable brick | left/right | Reverse horizontal direction vx = -vx |
| enemy (ground patrol) | question block | left/right | Reverse horizontal direction vx = -vx |
| enemy (flying patrol) | any | any | No collision, moves according to patrol path |
| enemy (stationary turret) | any | any | No collision, remains stationary |
| bullet | ground | any | Bullet destroyed |
| bullet | pipe | any | Bullet destroyed |
| bullet | breakable brick | any | Bullet destroyed |
| bullet | question block | any | Bullet destroyed |
| mushroom | ground | left/right | Reverse horizontal direction vx = -vx |
| mushroom | pipe | left/right | Reverse horizontal direction vx = -vx |

**Collision Handling Notes**:
- Framework automatically handles ALL physics blocking via `resolve_physics_collision()`
- `handle_collision()` should ONLY contain game logic (collecting items, destroying entities, etc.)
- DO NOT manually revert positions or stop velocities in `handle_collision()` - framework does this automatically

**5. Ground Detection (GroundedFlag Update)**:
- Reset all entities' is_grounded flags at the beginning of each frame
  - Query all entities with GroundedFlag
  - Set grounded.is_grounded = False
- During collision detection, when entity stands on solid from above:
  - If collision direction == "top" and entityB is solid
  - Set grounded.is_grounded = True

**6. Boundary Detection and Constraints**:
- Query all entities with Position, PreviousPosition, Tag components
- Apply different boundary handling based on entity type:
  - **player**:
    - If pos.x < 0 (exceeds left boundary), revert: pos.x = prev_pos.x
    - Can exceed right boundary (this is victory condition)
    - If pos.y > screen_height (falls off bottom), mark for destruction
  - **bullet and mushroom**:
    - If out of bounds (pos.x < 0 or pos.x > map_width or pos.y > screen_height), mark for destruction
  - **enemy**:
    - If exceeds left/right boundaries (pos.x < 0 or pos.x > map_width), revert: pos.x = prev_pos.x
    - For ground patrol type enemies, reverse horizontal direction: vel.vx = -vel.vx

---

### Layer 6: RenderSystem
**Responsibility**: Render the game to the screen

**Render Layer Order** (bottom to top):
- Layer 0: Ground and background (ground, pipe)
- Layer 1: Bricks and question blocks (breakable brick, question block)
- Layer 2: Props (coin, mushroom)
- Layer 3: Characters (player, enemy)
- Layer 4: Special objects (bullet, moving platform, springboard, cannon)