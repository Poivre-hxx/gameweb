## Game Overview
The player jumps on platforms, collects coins, defeats enemies, and wins by reaching the rightmost end of the map. The game features a gravity system, and the player must jump to avoid obstacles and enemies.

---

## Entity Definitions

### Prop Entities

#### ground
**Description**: Basic ground that prevents the player and enemies from falling through
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static (does not move, blocks other entities)
**Movement Mode**:
- MovementMode = none
**Collision Behavior**:
- Blocks player and enemies from passing downward (provides standing support)
- Blocks player and enemies from passing from the sides

#### breakable brick
**Description**: A brick that can be broken when the player hits it from below
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static
**Movement Mode**:
- MovementMode = none
**Collision Behavior**:
- Player hits from below: Brick is destroyed
- Player lands on top: Provides standing support (not destroyed)
- Player collides from side: Blocks passage
- Enemy: Normal collision (blocks)

#### question block
**Description**: A question block containing `mushroom`, spawns a `mushroom` directly above when hit from below by the player, then turns into an empty block
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static
**Movement Mode**:
- MovementMode = none
**Collision Behavior**:
- Player hits from below:
  - If not activated, spawns mushroom/coin, block changes to "activated" state (color becomes `#30302e`)
  - If already activated, no effect
- Player lands on top: Provides standing support
- Player collides from side: Blocks passage
- Enemy: Normal collision (blocks)

#### pipe
**Description**: An indestructible obstacle
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static
**Movement Mode**:
- MovementMode = none
**Collision Behavior**:
- Blocks player and enemies from any direction
- Can serve as a standing platform

#### cannon
**Description**: A fixed device that fires bullets at regular intervals
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static
**Movement Mode**:
- MovementMode = none
**Properties**:
- Firing interval: 10.0 seconds
- Firing direction: Horizontal left (-1, 0)
**Behavior**:
- Automatically fires one bullet every 10 seconds
**Collision Behavior**:
- Blocks player and enemies from passing
- Can serve as a standing platform

#### coin
**Description**: A collectible coin that disappears when touched
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static (non-blocking collectible)
**Movement Mode**:
- MovementMode = none
**Collision Behavior**:
- Player touches: Coin is destroyed

#### mushroom
**Description**: Grants the player an ability boost when consumed
**Spawn Method**:
- SpawnType = trigger (spawned from question blocks)
- SpawnType = init (marked on the map)
**Physics Type**:
- PhysicsBody = dynamic (affected by gravity)
**Movement Mode**:
- MovementMode = auto (horizontal movement + gravity)
**Properties**:
- Movement speed: 10 pixels/second
- Initial direction: Right (1, 0)
- Affected by gravity
**Behavior**:
- Reverses horizontal direction when hitting walls or pipes
- Falls to the ground and moves along the ground
**Collision Behavior**:
- Player touches: Mushroom is destroyed, player gains ability
- Bricks/pipes: Reverses movement direction
- Enemy: Passes through (no collision)

#### moving platform
**Description**: A platform that moves up and down
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = kinematic (moves but not affected by gravity)
**Movement Mode**:
- MovementMode = auto
**Properties**:
- Movement speed: 8 pixels/second
- Movement range: 100 pixels up and down from initial position
- Movement direction: Initially upward
**Behavior**:
- Reverses direction when reaching movement range boundaries
- When the player stands on the platform, the player follows the platform's movement
**Collision Behavior**:
- Player lands on top: Provides standing support, player follows platform movement
- Player collides from side or below: Blocks passage

#### springboard
**Description**: A springboard that provides extra jump power when stepped on
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = static
**Movement Mode**:
- MovementMode = none
**Collision Behavior**:
- Player lands on top: Player gains upward velocity of 600 pixels/second (super jump)
- Enemy: Also gains bounce effect

#### bullet
**Description**: A bullet fired from cannons, travels in a straight line
**Spawn Method**:
- SpawnType = trigger (dynamically created when cannon fires)
**Spawn Parameters**:
- Spawn position (x, y): Center position of the cannon
- Firing direction (dx, dy): (-1, 0) horizontal left
**Physics Type**:
- PhysicsBody = kinematic (not affected by gravity)
**Movement Mode**:
- MovementMode = auto (automatically moves at fixed speed and direction, unaffected by gravity)
**Properties**:
- Movement speed: 0.5 pixels/second
- Size: 12x12 pixels
**Collision Behavior**:
- Hits player: Bullet destroyed, player takes damage (simplified to player destruction in this version)
- Hits bricks/pipes: Bullet destroyed
- Out of map bounds: Bullet destroyed
- Hits enemy: Passes through (no collision)

---

### Character Entities

#### player
**Description**: An entity controlled by the player via keyboard
**Spawn Method**:
- SpawnType = init
**Physics Type**:
- PhysicsBody = dynamic (affected by gravity, blocked by static/kinematic)
**Movement Mode**:
- MovementMode = trigger
**Controls**:
- A/D or Left/Right arrow keys control horizontal movement
- Spacebar to jump
**Properties**:
- Horizontal movement speed: 20 pixels/second
- Jump initial velocity: -400 pixels/second (upward)
- Gravity acceleration: 1200 pixels/second²
- Maximum fall speed: 600 pixels/second
**Behavior**:
- Can stand on bricks
- Affected by gravity, continuously accelerates downward
- Can only jump when on the ground (determined by is_grounded flag)
- Hitting bricks from below can break breakable bricks or activate question blocks
- Stomping on enemies can eliminate enemies
- Collects coins and mushrooms
**Collision Behavior**:
- Collides with ground/pipes/platforms: Blocks movement, stops vertical movement
- Stomps enemy from above: Enemy destroyed, player gains upward bounce velocity of -200 pixels/second
- Collides with enemy from side: Player destroyed (game failure)
- Collides with bullet: Player destroyed (game failure)
- Steps on springboard: Gains super jump
- Collects coins/mushrooms: Props destroyed
- Hits bricks from below: Breaks breakable bricks, activates question blocks

#### enemy
**Description**: An enemy whose movement mode is automatically determined based on spawn position
**Spawn Method**:
- SpawnType = init
**Physics Type** (varies by AI type):
- Ground Patrol: PhysicsBody = dynamic (affected by gravity)
- Flying Patrol: PhysicsBody = kinematic (not affected by gravity)
- Stationary Turret: PhysicsBody = kinematic (not affected by gravity)
**Movement Mode**:
- MovementMode = auto (AI mode automatically selected based on element type below)
- AI Type Determination Rules (determined by the element directly below the enemy's position at spawn):
  - **Ground Patrol Type**
    Determination Condition: Element directly below enemy is B(ground) or S(breakable brick)
    Physics: PhysicsBody = dynamic (affected by gravity)
    Movement Mode: Horizontal left-right patrol
    Horizontal movement speed: 0.8 pixels/second
    Maximum fall speed: 600 pixels/second
    Initial direction: Left (-1, 0)
    Affected by gravity
    Behavior:
      Moves left and right along the ground
      Reverses direction when hitting walls, pipes, or map boundaries
      Falls off platform edges
  - **Flying Patrol Type**
    Determination Condition: Element directly below enemy is X(space), i.e., suspended in air
    Physics: PhysicsBody = kinematic (not affected by gravity)
    Movement Mode: Four-direction patrol (up/down/left/right)
    Movement speed: 0.6 pixels/second
    Initial direction: Left (-1, 0)
    Not affected by gravity
    Behavior:
      Patrols in a rectangular area in a loop
      Patrol path: Centered at initial position, moves 100 pixels left/right, 80 pixels up/down
      Patrol sequence: Left → Down → Right → Up → Left (loop)
      Reverses current direction when hitting map boundaries
  - **Stationary Turret Type**
    Determination Condition: Element directly below enemy is P(pipe), standing on a pipe
    Physics: PhysicsBody = kinematic (static-like but categorized as kinematic)
    Movement Mode: Completely stationary
    Does not move
    Not affected by gravity (supported by pipe)
    Behavior:
      Fixed on top of pipe, does not move at all
      Acts as a static obstacle
**Collision Behavior**:
  Stomped by player from above: Enemy destroyed
  Collides with player from side: Player destroyed
  Hits walls/pipes: Ground patrol type reverses direction; flying patrol type moves according to patrol logic
  Collides with bullet: Passes through (no collision)
  Collides with enemy: Passes through (no collision)

