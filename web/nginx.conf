# Nginx 配置文件示例 - 2D Game Web
# Nginx Configuration Example for 2D Game Web

server {
    # 监听端口
    listen 80;
    listen [::]:80;

    # 服务器域名或 IP（请修改为您的实际域名或 IP）
    # Server name or IP (replace with your actual domain or IP)
    server_name your-domain.com www.your-domain.com;
    # 或者使用 IP: server_name 192.168.1.100;

    # 网站根目录（请修改为您的实际路径）
    # Root directory (replace with your actual path)
    root /var/www/html/2dgame;

    # 默认首页
    index index.html;

    # 字符集
    charset utf-8;

    # 访问日志和错误日志
    access_log /var/log/nginx/2dgame-access.log;
    error_log /var/log/nginx/2dgame-error.log;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # 静态资源缓存配置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 处理 SPA 路由（React Router）
    # 所有请求都返回 index.html，让前端路由处理
    location / {
        try_files $uri $uri/ /index.html;

        # 安全头设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

